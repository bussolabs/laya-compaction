name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Public repository: org self-hosted runners and the private ci-templates are not available here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level high
      - run: npm run typecheck
      - run: npm test

  publish:
    # Stable tags only: a pre-release tag would become npm's "latest".
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: The tag and the package version are the same number
        run: |
          set -eu
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::package.json says $actual, the tag says $expected: update package.json before tagging"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # OIDC trusted publishing (npm >= 11.5.1, shipped with node 24): no long-lived token.
      - run: npm publish --access public --provenance
